# PR / push: unit tests → wheel artifact (after tests pass).
# Merge/push to main|master: also auto-bump patch version, tag, and
# GitHub Release with .whl so users can pip-install from the release.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q --tb=short

  build-artifact:
    name: Build & upload wheel artifact
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: infercache-wheel-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Every merge/push to main|master → next patch tag + Release with wheel.
  # Skips commits marked [skip ci] (e.g. the version-bump commit from this job).
  release:
    name: Tag & GitHub Release
    if: >
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && !contains(github.event.head_commit.message, '[skip ci]')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -z "$latest" ]]; then
            # First release: use version already in pyproject.toml
            next="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
            if [[ -z "$next" ]]; then
              next="0.1.0"
            fi
          else
            ver="${latest#v}"
            IFS=. read -r major minor patch <<< "$ver"
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
          fi

          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${next} (previous: ${latest:-none})"

      - name: Bump version in pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.next }}"/' pyproject.toml
          grep '^version =' pyproject.toml

      - name: Install build tools & build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -la dist/

      - name: Verify wheel assets exist
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t WHLS < <(ls -1 dist/*.whl)
          mapfile -t SDISTS < <(ls -1 dist/*.tar.gz)
          if [[ ${#WHLS[@]} -lt 1 || ${#SDISTS[@]} -lt 1 ]]; then
            echo "Expected .whl and .tar.gz in dist/ after build" >&2
            ls -la dist/ || true
            exit 1
          fi
          echo "Found wheel: ${WHLS[0]}"
          echo "Found sdist: ${SDISTS[0]}"
          {
            echo "whl=${WHLS[0]}"
            echo "sdist=${SDISTS[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release build as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: infercache-release-${{ steps.version.outputs.tag }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Commit version bump, tag, and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit if pyproject.toml actually changed
          if git diff --quiet -- pyproject.toml; then
            echo "No changes to pyproject.toml; skipping commit."
          else
            git add pyproject.toml
            git commit -m "chore: bump version to ${{ steps.version.outputs.next }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

          # Create tag if it does not already exist, then push it
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping tag creation."
          else
            git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      # Attach .whl + .tar.gz as Release assets (visible on the Releases page).
      - name: Create GitHub Release and attach wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          WHL="${{ steps.assets.outputs.whl }}"
          SDIST="${{ steps.assets.outputs.sdist }}"

          test -f "$WHL"
          test -f "$SDIST"

          NOTES="$(printf '%s\n\n### Install\n\n```bash\npip install %s\n```\n' \
            "InferCache ${TAG}" \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/$(basename "$WHL")")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading/replacing assets"
            gh release upload "$TAG" "$WHL" "$SDIST" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            echo "Creating release $TAG with wheel assets"
            gh release create "$TAG" "$WHL" "$SDIST" \
              --title "$TAG" \
              --notes "$NOTES"
          fi

          echo "Release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
