[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infercache"
version = "0.2.1"
description = "Local-first LLM caching, semantic matching, cascade routing, and token cost reduction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "InferCache Contributors" }]
keywords = [
    "llm",
    "caching",
    "semantic-cache",
    "token-optimization",
    "openai",
    "anthropic",
    "cost-reduction",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
semantic = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7; platform_system != 'Darwin' or platform_machine != 'arm64'",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
bedrock = ["boto3>=1.34"]
redis = ["redis>=4.0"]
all = ["infercache[semantic,openai,anthropic,bedrock,redis]"]
dev = [
    "infercache[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "fakeredis>=2.20",
]

[project.scripts]
infercache = "infercache.cli.main:main"
infercache-mcp = "infercache.mcp.server:run_stdio_server"

[project.urls]
Homepage = "https://github.com/infercache/infercache"
Documentation = "https://github.com/infercache/infercache#readme"
Repository = "https://github.com/infercache/infercache"

[tool.hatch.build.targets.wheel]
packages = ["src/infercache"]

[tool.hatch.build.targets.sdist]
include = ["src/infercache", "README.md", "LICENSE", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that hit real services or heavy optional deps (opt-in)",
    "slow: long-running tests excluded from the default fast suite",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Core correctness + modernization gates. PTH (pathlib) is deferred to a fast-follow
# (see docs/plan/07-quality-and-ci.md) to avoid churning working file-IO in Phase 0.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["src/infercache"]

# Strict typing on the core; tighten the rest over time (see docs/plan/07-quality-and-ci.md).
[[tool.mypy.overrides]]
module = [
    "infercache.core.*",
    "infercache.config.*",
    "infercache.storage.*",
    "infercache.metrics.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
source = ["infercache"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
